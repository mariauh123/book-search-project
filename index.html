<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Book Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Book Search</h1>
            <img id='logo' src='owl_logo.png'alt='Owl wearing glasses and carrying a book - logo.'>
        </header>
        <main>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search for books...">
                <button type="submit" class="btn-grad">Search</button>
            </form>

            <ul id="results"></ul>
        </main>
        <footer>
            <p>Made for my Web Fundamentals Course</p>
            <p>Maria Perez Portales 2026</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
